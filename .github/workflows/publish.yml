name: Publish to npm

# Publishes with npm trusted publishing (OIDC): there is no NPM_TOKEN. npm checks that the run comes
# from this repository and this workflow file, so the trusted publisher on npmjs.com must name
# pooyagolchian/vue-star-rate and publish.yml exactly. It needs npm >= 11.5.1 (Node >= 22.14).
#
# Two jobs on purpose. `verify` runs the tests and the consumer smoke test (freshly resolved
# third-party bundlers) with read-only permissions. Only `publish`, which runs none of that code, may
# ask GitHub for an OIDC token, and it publishes the exact tarball that `verify` tested.
on:
  push:
    tags: ['v*']

concurrency:
  group: publish
  cancel-in-progress: false # never interrupt a release that is already publishing

permissions: {} # each job asks for what it needs

jobs:
  verify:
    name: verify and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the "tag is on main" check needs the history of main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      # No `cache: pnpm`: a release job must not write to (or restore from) a shared cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the tag
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the package.json version ${version}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main; releases are cut from main only"
            exit 1
          fi
          case "${version}" in
            *-*) echo "dist-tag=next" >> "${GITHUB_OUTPUT}" ;; # a prerelease must not become `latest`
            *) echo "dist-tag=latest" >> "${GITHUB_OUTPUT}" ;;
          esac
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:run
      - run: pnpm run build
      - name: Pack the tarball that will be published
        run: mkdir release && npm pack --pack-destination release
      # Installs that tarball into clean apps without lucide-vue-next (issues #7 and #13).
      - name: Consumer smoke test
        run: pnpm run smoke:consumers --tarball "$(ls "$PWD"/release/*.tgz)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # lets npm verify this run via OIDC and attach a provenance statement
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: release
      # npm, not pnpm: the OIDC exchange is done by the npm CLI.
      - name: Publish
        run: npm publish ./release/*.tgz --provenance --access public --tag "${DIST_TAG}"
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
