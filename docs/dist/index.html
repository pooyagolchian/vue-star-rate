    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Do I need lucide-vue-next if I use FontAwesome or a custom icon?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Since v3.1.0, vue-js-star-rating loads icon providers with defineAsyncComponent, so the lucide-vue-next package is only required when iconProvider=\"lucide\" is rendered. Consumer bundlers (Vite, Webpack, Rollup, esbuild) will not attempt to resolve it at build time when you use the default SVG, FontAwesome, or custom slot icon."
            }
          },
          {
            "@type": "Question",
            "name": "Is vue-js-star-rating SSR-safe and Nuxt 3 compatible?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The component renders deterministically on the server. Async icon providers resolve on the client after hydration. Wrap in <ClientOnly> for Nuxt or <Suspense> to control loading state. The default SVG provider works fully server-side."
            }
          },
          {
            "@type": "Question",
            "name": "What is the bundle size of vue-js-star-rating?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "About 3 KB gzipped for the default SVG path (component + composable + types stripped). Lucide and FontAwesome chunks are emitted as separate files and only fetched when the matching provider is rendered."
            }
          },
          {
            "@type": "Question",
            "name": "Is it accessible?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The root carries role=\"group\" and an aria-label. Each star button exposes aria-pressed. The counter uses aria-live=\"polite\" for live announcements. Full keyboard navigation: arrow keys, Home, End, 0-9. Animations are gated on prefers-reduced-motion. Compliant with WCAG 2.2 Level AA."
            }
          },
          {
            "@type": "Question",
            "name": "Can I use it without v-model?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Pass :model-value and listen to @change or @update:modelValue. The useStarRating composable is also exported for headless control."
            }
          },
          {
            "@type": "Question",
            "name": "Which Vue versions are supported?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Vue 3.5+ is required. The component uses defineModel, useTemplateRef, and MaybeRefOrGetter, all stable in Vue 3.5. Vue 2 is not supported."
            }
          }
        ]
      }
    </script>
